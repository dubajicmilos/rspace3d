[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rspace3d"
version = "2.1.0"
description = "Reciprocal Space 3D Processing Toolkit for single-crystal X-ray diffuse scattering"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "Milos Dubajic"},
]
keywords = ["crystallography", "diffuse-scattering", "reciprocal-space", "synchrotron", "CrysAlisPro"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "numpy",
    "scipy",
    "fabio",
    "h5py",
    "matplotlib",
    "PyQt6",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x"]
viz3d = ["pyvista"]
plotly = ["plotly"]
all = ["cupy-cuda12x", "pyvista", "plotly"]

[project.scripts]
rspace3d-process = "rspace3d.volume_process:main"
rspace3d-viewer = "rspace3d.rsp_viewer:main"
rspace3d-builder = "rspace3d.volume_builder_gui:main"
rspace3d-reconstruct = "rspace3d.reconstruct_gui:main"

[project.urls]
Homepage = "https://github.com/dubajicmilos/rspace3d"
Documentation = "https://github.com/dubajicmilos/rspace3d#readme"

[tool.setuptools]
packages = ["rspace3d", "rspace3d.rawrecon"]
